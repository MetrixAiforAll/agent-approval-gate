name: ci

on:
  push:
  pull_request:

# No secrets are configured and none are needed: the gate integrity tests use no model,
# and the demo replays recorded fixtures through the real enforcement path.
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run demo
